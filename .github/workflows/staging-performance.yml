name: Staging performance test

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Read-only workload to run against the shared staging environment.
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - load

permissions:
  contents: read

concurrency:
  group: staging-performance-test
  cancel-in-progress: false

jobs:
  performance:
    name: ${{ inputs.profile }} performance baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASSMS_CUSTOMER_API_URL: ${{ vars.VITE_CUSTOMER_API_URL }}
      ASSMS_JOB_API_URL: ${{ vars.VITE_JOB_API_URL }}
      ASSMS_DISPATCH_API_URL: ${{ vars.VITE_DISPATCH_API_URL }}
      ASSMS_REPORTING_API_URL: ${{ vars.VITE_REPORTING_API_URL }}
      ASSMS_LOAD_LOGIN_IDENTIFIER: ${{ secrets.ASSMS_LOAD_LOGIN_IDENTIFIER }}
      ASSMS_LOAD_LOGIN_PASSWORD: ${{ secrets.ASSMS_LOAD_LOGIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java for JMeter
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify required staging configuration
        run: |
          for setting in \
            ASSMS_CUSTOMER_API_URL \
            ASSMS_JOB_API_URL \
            ASSMS_DISPATCH_API_URL \
            ASSMS_REPORTING_API_URL \
            ASSMS_LOAD_LOGIN_IDENTIFIER \
            ASSMS_LOAD_LOGIN_PASSWORD; do
            test -n "${!setting}" || { echo "::error::$setting is not configured"; exit 1; }
          done

      - name: Run read-only staging performance test
        run: |
          chmod +x tests/load/tools/apache-jmeter-5.6.3/bin/jmeter
          python tests/load/run_performance_tests.py --profile "${{ inputs.profile }}"

      - name: Upload performance dashboard and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-performance-${{ inputs.profile }}-${{ github.run_number }}
          path: tests/load/results/
          if-no-files-found: warn
          retention-days: 30
