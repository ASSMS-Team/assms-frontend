name: Frontend Staging CD

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Exact commit SHA validated by the calling CI workflow.
        required: true
        type: string
      source_ref:
        description: Source ref validated by the calling CI workflow.
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-staging-deployment
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy frontend to staging
    if: inputs.source_ref == 'refs/heads/dev' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      FRONTEND_APP_NAME: ${{ vars.FRONTEND_APP_NAME }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      DEPLOY_SHA: ${{ inputs.commit_sha || github.sha }}
      VITE_CUSTOMER_API_URL: ${{ vars.VITE_CUSTOMER_API_URL }}
      VITE_JOB_API_URL: ${{ vars.VITE_JOB_API_URL }}
      VITE_DISPATCH_API_URL: ${{ vars.VITE_DISPATCH_API_URL }}
      VITE_REPORTING_API_URL: ${{ vars.VITE_REPORTING_API_URL }}

    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build staging frontend
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist
          test -f dist/index.html
          printf '{"commit":"%s"}\n' "$DEPLOY_SHA" > dist/deployment.json

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy compiled SPA to App Service
        run: |
          (
            cd dist
            zip -r ../frontend-staging.zip .
          )
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FRONTEND_APP_NAME" \
            --src-path frontend-staging.zip \
            --type zip \
            --async false \
            --track-status false \
            --timeout 600000

      - name: Verify SPA hosting and backend API configuration
        run: |
          startup_command="$(az webapp config show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FRONTEND_APP_NAME" \
            --query appCommandLine -o tsv)"
          test "$startup_command" = "pm2 serve /home/site/wwwroot --no-daemon --spa"
          # Wait for the actual deployed revision, rather than Azure's Linux
          # startup tracker, which can report a timeout for a healthy site.
          revision_ready=false
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
              "${FRONTEND_URL}/deployment.json?revision=${DEPLOY_SHA}" \
              --output "$RUNNER_TEMP/frontend-deployment.json" && \
              cmp -s dist/deployment.json "$RUNNER_TEMP/frontend-deployment.json"; then
              revision_ready=true
              break
            fi
            sleep 5
          done
          test "$revision_ready" = true
          for route in / /assets/new; do
            body="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 "${FRONTEND_URL}${route}")"
            grep -F '<div id="root"></div>' <<< "$body"
          done
          for api_url in \
            "$VITE_CUSTOMER_API_URL" \
            "$VITE_JOB_API_URL" \
            "$VITE_DISPATCH_API_URL" \
            "$VITE_REPORTING_API_URL"; do
            test -n "$api_url"
            curl --fail --silent --show-error --retry 6 \
              "${api_url}/api/health" > /dev/null
          done
